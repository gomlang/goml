name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  build:
    name: Build stage2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.40.0'
      - name: Build stage2
        run: just make
      - name: Pack stage2 build
        run: |
          tar -czf stage2-build.tar.gz \
            stage2 \
            gomlc/_bootstrap/stage2/build/pkg \
            goml/_bootstrap/stage2/build/pkg
      - uses: actions/upload-artifact@v7
        with:
          name: stage2-build
          path: stage2-build.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Export release sources
        run: bash tools/release/sources.sh _artifact/release-sources.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-sources
          path: _artifact/release-sources.tar.gz
          if-no-files-found: error
          retention-days: 1

  test-build:
    name: Build ${{ matrix.suite }} tests
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: compiler
            recipe: _ci-gomlc-test-build
            test_root: _artifact/gomlc-test/test
          - suite: driver
            recipe: _ci-goml-test-build
            test_root: goml/_artifact/test
          - suite: stdlib
            recipe: _ci-stdlib-test-build
            test_root: _artifact/stdlib-test/test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.40.0'
      - uses: actions/download-artifact@v8
        with:
          name: stage2-build
      - name: Unpack stage2 build
        run: tar -xzf stage2-build.tar.gz
      - name: Build tests
        env:
          GOML_TEST_JOBS: '4'
        run: just ${{ matrix.recipe }}
      - name: Pack tests
        env:
          TEST_ROOT: ${{ matrix.test_root }}
          TEST_ARCHIVE: ${{ matrix.suite }}-tests.tar.gz
        run: |
          test_artifacts=()
          if test -d "$TEST_ROOT/lib"; then
            test_artifacts+=("$TEST_ROOT/lib")
          fi
          for kind in internal external; do
            group="$TEST_ROOT/$kind"
            if test -f "$group/runner"; then
              test_artifacts+=("$group/runner" "$group/tests.json")
            fi
          done
          tar -czf "$TEST_ARCHIVE" "${test_artifacts[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-tests
          path: ${{ matrix.suite }}-tests.tar.gz
          if-no-files-found: error
          retention-days: 1

  sharded-tests:
    name: ${{ matrix.name }} tests (${{ matrix.shard }}/4)
    needs: test-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [compiler, driver, stdlib]
        shard: [1, 2, 3, 4]
        include:
          - suite: compiler
            name: Compiler
            recipe: _ci-gomlc-test-run
          - suite: driver
            name: Driver
            recipe: _ci-goml-test-run
          - suite: stdlib
            name: Standard library
            recipe: _ci-stdlib-test-run
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.40.0'
      - name: Install Yaegi interpreter
        if: matrix.suite == 'compiler'
        run: curl -sfL https://raw.githubusercontent.com/traefik/yaegi/master/install.sh | bash -s -- -b "$(go env GOPATH)/bin" v0.16.1
      - uses: actions/download-artifact@v8
        with:
          name: stage2-build
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.suite }}-tests
      - name: Unpack build artifacts
        env:
          TEST_ARCHIVE: ${{ matrix.suite }}-tests.tar.gz
        run: |
          tar -xzf stage2-build.tar.gz
          tar -xzf "$TEST_ARCHIVE"
      - name: Run tests
        env:
          GOML_TEST_JOBS: '4'
          GOML_TEST_SHARD: ${{ matrix.shard }}/4
        run: just ${{ matrix.recipe }}

  checks:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Script tests
            recipe: _ci-scripts
            node: false
          - name: Fixed point
            recipe: _bootstrap-stage3
            node: false
          - name: VS Code extension
            recipe: _ci-vscode
            node: true
          - name: Release archive smoke
            recipe: _ci-release-smoke
            node: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.40.0'
      - uses: actions/setup-node@v7
        if: matrix.node
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: stage2-build
      - name: Unpack stage2 build
        run: tar -xzf stage2-build.tar.gz
      - name: Run ${{ matrix.name }}
        env:
          GOML_TEST_JOBS: '4'
        run: just ${{ matrix.recipe }}

  macos:
    name: macOS arm64 release archive
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-sources
      - name: Unpack release sources
        run: tar -xzf release-sources.tar.gz
      - name: Build release archive
        run: bash tools/release/package.sh "$(cat VERSION)" darwin arm64
      - name: Smoke test release archive
        run: bash tools/release/smoke.sh "$(cat VERSION)" darwin arm64
      - uses: actions/upload-artifact@v7
        with:
          name: goml-darwin-arm64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  test:
    name: test
    if: always()
    needs:
      - build
      - checks
      - test-build
      - sharded-tests
      - macos
    runs-on: ubuntu-24.04
    steps:
      - name: Verify CI results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_BUILD_RESULT: ${{ needs.test-build.result }}
          SHARDED_TESTS_RESULT: ${{ needs.sharded-tests.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CHECKS_RESULT" = success
          test "$TEST_BUILD_RESULT" = success
          test "$SHARDED_TESTS_RESULT" = success
          test "$MACOS_RESULT" = success
