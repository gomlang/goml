name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.40.0'
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          release_version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$release_version"
          bash tools/release/release.sh check-version "$release_version"
          ci_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 1 \
            --json status,conclusion,url \
            --jq 'if length == 0 then "" else .[0] | "\(.status)|\(.conclusion)|\(.url)" end')"
          if test -z "$ci_run"; then
            echo "main CI run not found for $GITHUB_SHA" >&2
            exit 1
          fi
          IFS='|' read -r ci_status ci_conclusion ci_url <<< "$ci_run"
          if test "$ci_status" != "completed" || test "$ci_conclusion" != "success"; then
            echo "main CI has not succeeded for $GITHUB_SHA: $ci_status $ci_conclusion $ci_url" >&2
            exit 1
          fi
          release_tags="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[].tagName')"
          previous_tag="$(bash tools/release/release.sh latest $release_tags)"
          previous_version="${previous_tag#v}"
          bash tools/release/release.sh check-next "$previous_version" "$release_version"
          bash tools/release/release.sh check-stage0 "$previous_version"
          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>/dev/null || true)"
          test "$release_state" != "false"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
      - name: Build stage2
        run: just make-tools
      - name: Build release archive
        run: bash tools/release/package.sh "$RELEASE_VERSION"
      - name: Smoke test release archive
        run: bash tools/release/smoke.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: goml-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>/dev/null || true)"
          if test "$release_state" = ""; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "goml $RELEASE_TAG" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
