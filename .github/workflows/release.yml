name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      previous_tag: ${{ steps.validate.outputs.previous_tag }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.40.0'
      - name: Validate release version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          release_version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$release_version"
          test "${release_version%.*}" = "0.1"
          bash tools/release/release.sh check-version "$release_version"
          release_sha="$(git rev-parse HEAD)"
          ci_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --commit "$release_sha" \
            --event push \
            --limit 1 \
            --json status,conclusion,url \
            --jq 'if length == 0 then "" else .[0] | "\(.status)|\(.conclusion)|\(.url)" end')"
          if test -z "$ci_run"; then
            echo "main CI run not found for $release_sha" >&2
            exit 1
          fi
          IFS='|' read -r ci_status ci_conclusion ci_url <<< "$ci_run"
          if test "$ci_status" != "completed" || test "$ci_conclusion" != "success"; then
            echo "main CI has not succeeded for $release_sha: $ci_status $ci_conclusion $ci_url" >&2
            exit 1
          fi
          release_tags="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[].tagName')"
          previous_tag="$(bash tools/release/release.sh latest $release_tags)"
          previous_version="${previous_tag#v}"
          bash tools/release/release.sh check-next "$previous_version" "$release_version"
          bash tools/release/release.sh check-stage0 "$previous_version"
          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>/dev/null || true)"
          test "$release_state" != "false"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Build stage2
        run: just make-tools
      - name: Export release sources
        run: bash tools/release/sources.sh _artifact/release-sources.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-sources
          path: _artifact/release-sources.tar.gz
          if-no-files-found: error
          retention-days: 1

  archives:
    name: ${{ matrix.goos }}/${{ matrix.goarch }} archive
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_GOOS: ${{ matrix.goos }}
      RELEASE_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-sources
      - name: Unpack release sources
        run: tar -xzf release-sources.tar.gz
      - name: Build release archive
        run: bash tools/release/package.sh "$RELEASE_VERSION" "$RELEASE_GOOS" "$RELEASE_GOARCH"
      - name: Smoke test release archive
        run: bash tools/release/smoke.sh "$RELEASE_VERSION" "$RELEASE_GOOS" "$RELEASE_GOARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: goml-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - archives
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: goml-*
          path: dist
          merge-multiple: true
      - name: Verify archives and collect checksums
        run: bash tools/release/checksums.sh "$RELEASE_VERSION"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>/dev/null || true)"
          test "$release_state" != "false"
          if test "$release_state" = ""; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "goml $RELEASE_TAG" \
              --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG"
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "dist/goml-$RELEASE_VERSION-linux-amd64.tar.gz" \
            "dist/goml-$RELEASE_VERSION-darwin-arm64.tar.gz" \
            dist/SHA256SUMS \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
